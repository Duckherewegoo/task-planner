name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.gitignore']
  schedule:
    # 每天凌晨 2 点（UTC）跑一次真实 LLM 评测，监控模型漂移
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - name: Cache pytest and ruff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ruff
            .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('**/pyproject.toml') }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 强制要求 3.14 的库如果有 C 扩展，可能需要预装系统依赖，防编译挂掉
      - run: sudo apt-get update && sudo apt-get install -y libxml2-dev libxslt1-dev
      # 加上 --cov 统计覆盖率
      - run: pytest tests/ -q -n auto --cov=src --cov-report=xml
        env:
          USE_MOCK_LLM: "true"
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 加上 -n auto 并行，防止集成测试太慢超时
      - run: pytest tests/ -m integration -v -n auto
        env:
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: task_planner_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          USE_MOCK_LLM: "true"
      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            .pytest_cache/
            *.html

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: pip install ruff
      - run: ruff format --check src/ tests/
        continue-on-error: true # 先保留软性检查，等代码全格式化后再改成 false

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pyright src/
        continue-on-error: true

  # 新增：每天定时跑真实 LLM 评测，监控模型漂移
  eval-live:
    if: github.event_name == 'schedule' && secrets.DASHSCOPE_API_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Live LLM Evaluation
        run: pytest tests/eval_suite/ -m eval_live -v
        env:
          USE_MOCK_LLM: "false"
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }} # 确保你在 Github Repo 设置里配置了这个 secret
      - name: Upload Eval HTML Report
        if: always() # 无论成功失败都上传报告
        uses: actions/upload-artifact@v4
        with:
          name: eval-live-report
          path: "*.html" # 如果生成报告的话

  checks-passed:
    if: always()
    # 补全依赖关系：format 和 pyright 暂时作为软性检查，不阻塞最终绿灯，但 eval-live 如果是手动/定时触发也依赖
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    steps:
      - name: 挂了吗？
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "挂了，自己看上面日志。"
          exit 1
      - name: 挂了!
        if: failure() || cancelled()
        run: echo "别灰心，修 Bug 就像喝水，一杯接一杯。💪"
      - name: 绿了
        if: success()
        run: |
          sudo apt-get install -y cowsay
          echo "完美！" | cowsay -f tux
