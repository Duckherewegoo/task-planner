name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── 最小权限：只需要读代码 ──
permissions:
  contents: read

# ── 同一分支连续 push 时，自动取消旧 run ──
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════════
  #  红线层：必须通过才能合并
  # ══════════════════════════════════════════════════════════════

  # ── 快速静态检查（秒级，最先跑）──
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check src/ tests/

  # ── 单元测试（不碰外部服务）──
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest (unit)
        run: pytest tests/ -q
        env:
          USE_MOCK_LLM: "true"

  # ── 集成测试（起真 MongoDB + Redis）──
  # 这是 CI 不可替代的部分：验证"代码在新环境里能不能起来"
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest (integration)
        run: pytest tests/ -m integration -v
        env:
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: task_planner_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          USE_MOCK_LLM: "true"

  # ══════════════════════════════════════════════════════════════
  #  黄线层：希望过，暂不阻塞——但目标是把它们转成红线
  # ══════════════════════════════════════════════════════════════

  # ── 格式检查（黄线）──
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff format check
        run: ruff format --check src/ tests/
        # TODO(2026-11-01): 跑一遍 ruff format 后移除 continue-on-error
        continue-on-error: true

  # ── 类型检查（黄线，严格模式）──
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pyright
        run: pyright src/
        # TODO(2026-11-01): 清零 error 后移除 continue-on-error
        continue-on-error: true

  # ══════════════════════════════════════════════════════════════
  #  门禁：分支保护规则绑在 checks-passed 上
  #  黄线 job（format / pyright）故意不放进 needs——
  #  这样黄线的失败不会阻断合并，但错误依然在日志里可见
  # ══════════════════════════════════════════════════════════════
  checks-passed:
    if: always()
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "❌ 红线检查未通过"
          exit 1
      - run: echo "✅ 红线检查全部通过"
