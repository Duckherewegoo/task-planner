name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.gitignore']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: pip install ruff
      - run: ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest tests/ -q -n auto
        env:
          USE_MOCK_LLM: "true"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports: [27017:27017]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\")'"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest tests/ -m integration -v
        env:
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: task_planner_test
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          USE_MOCK_LLM: "true"

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: pip install ruff
      - run: ruff format --check src/ tests/
        continue-on-error: true

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pyright src/
        continue-on-error: true

  checks-passed:
    if: always()
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required checks passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: 失败时的安慰
        if: failure() || cancelled()
        run: |
          echo "别灰心，Bug 是修不完的！"
          echo "建议检查一下最近改动的文件，或者看看上面哪一个步骤红了。"
          echo "喝口水，重启一次，你一定能搞定！"

      - name: 成功时的彩蛋
        if: success()
        run: |
          sudo apt-get install -y cowsay
          echo "红线检查全部通过，准备合并！" | cowsay -f tux

      - name: 生成测试报告总结
        if: always()
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEG_RESULT: ${{ needs.integration.result }}
        run: |

          if [ "$LINT_RESULT" = "success" ]; then LINT_ICON="Pass"; else LINT_ICON="Fail"; fi
          if [ "$TEST_RESULT" = "success" ]; then TEST_ICON="Pass"; else TEST_ICON="Fail"; fi
          if [ "$INTEG_RESULT" = "success" ]; then INTEG_ICON="Pass"; else INTEG_ICON="Fail"; fi

          echo "## CI 检查结果" >> $GITHUB_STEP_SUMMARY
          echo "| 检查项 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | $TEST_ICON |" >> $GITHUB_STEP_SUMMARY
          echo "| 集成测试 | $INTEG_ICON |" >> $GITHUB_STEP_SUMMARY
          echo "| 代码规范 | $LINT_ICON |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "> 全部通过，可以合并。" >> $GITHUB_STEP_SUMMARY
          else
            echo "> 存在问题，请检查上方日志。" >> $GITHUB_STEP_SUMMARY
          fi
