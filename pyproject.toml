[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "task-planner"
version = "3.2.5"
description = "基于 LangGraph 与大语言模型的自主任务规划引擎，支持动态 DAG 编排、多模态意图识别与全流程可观测性评估（异步版）。"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "JiangDake", email = "dakeginger@qq.com" },
]
readme = "README.md"
keywords = ["llm-agent", "task-planning", "langgraph", "dag", "orchestration"]

dependencies = [
    # ── 核心 ──
    "langgraph>=1.2.11",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.30.0",
    
    # ── 数据库（Motor 异步驱动；pymongo 是 Motor 的底层依赖，保留显式声明）──
    # Motor 3.6+ 依赖 pymongo 4.x；显式写 pymongo 是为了版本下限可控，
    # 且 tests/test_mongodb.py 的 importorskip("pymongo") 依赖它可见。
    "motor>=3.6.0",
    "pymongo>=4.5.0",

    # ── 配置（cog/loader.py 硬依赖 YAML）──
    "pyyaml>=6.0.0",

    # ── 流程图（Dash 前端 + 导出）──
    #  dash[fastapi]：FastAPI backend 必需（Dash 4.2+ 官方支持）
    #  dash[async] 仍保留：部分内部路径（如 long_callback）可能引用 asgiref，
    #  两个 extras 不冲突，一起装最省心
    "dash[async,fastapi]>=4.4.0",
    "dash-cytoscape>=1.0.0",
    "plotly>=5.18.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
    "cairosvg>=2.7.0",
    "lxml>=5.0.0",
    "pydot>=3.0.0",
    "Pillow>=11.0.0",
    "wcwidth>=0.2.14",
    "jieba>=0.42.1",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
# 主要第三方llm提供商，可不装，仅在不使用OPENAI兼容时装
llms = [
   "dashscope>=1.20.0",
]
# ── 违禁词匹配加速（.py 里优雅降级，不装也能跑）──
words = [
    "pyahocorasick>=2.1.0",
]
# ── 高性能 JSON ──
orjson = [
    "orjson>=3.10.0",
]
# ── 配置工具增强（保留 YAML 注释）──
config-ui = [
    "ruamel.yaml>=0.18.0",
]
# ── Redis 会话存储（多 worker 部署）──
redis = [
    "redis>=5.0.0",
]
# ── MongoDB 异步驱动已提升为主依赖；此组保留仅作向后兼容占位 ──
db_extra = []

# ── 评估套件依赖 ──
# v3.2.3 起：evaluators 从 abandon 迁入 task_planner.evaluation，
# P1-1 已移除硬 import Levenshtein（改用 _tokenize 词元级 Jaccard），
# 因此本组不再需要 python-Levenshtein。如需外部脚本兼容旧实现，
# 请在 dev 组或自建虚拟环境里安装。
eval = []
# ── 开发依赖 ──
dev = [
    "pytest>=9.0.0",
    #  pytest-asyncio 1.x 与 0.x 的配置语法不同
    #    （asyncio_default_fixture_loop_scope 等）
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.6.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "mypy>=1.13.0",
    # 可选工具：用于外部脚本比对字符串相似度（本库自身不再依赖）
    "python-Levenshtein>=0.25.0",
    "pyahocorasick>=2.1.0",         # 违禁词匹配性能测试需要
]

[project.urls]
Homepage = "https://github.com/Duckherewegoo/task-planner"
Repository = "https://github.com/Duckherewegoo/task-planner"
Issues = "https://github.com/Duckherewegoo/task-planner/issues"

[project.scripts]
task-planner = "task_planner.main.app:main"
task-planner-config = "task_planner.config_ui.app:main"
#  下面这条只在 `pip install -e .` 开发模式下有效（tests/ 不打包）
#task-planner-eval = "tests.eval_suite.run_evaluation:main"
# eval 工具通过 `pytest -m eval_live` 或 `python -m tests.eval_suite.run_evaluation` 调用，
# 不注册为 entry point（tests/ 不打包，注册后普通用户 pip install 会得到坏命令）


# ══════════════════════════════════════════════════
#  打包配置
# ══════════════════════════════════════════════════

[tool.setuptools.packages.find]
where = ["src"]
include = ["task_planner*"]
# 排除归档代码（不安装到 site-packages）
# v3.2.3 起：task_planner.evaluation 已升级为正式包，被 include 自动纳入
exclude = ["task_planner.abandon*"]

[tool.setuptools.package-data]
#  prompts/ 下的 .txt 必须打包，否则 pip install 后运行时读不到
"task_planner.infrastructure.prompts" = ["*.txt"]
#  assets 里的资源（如果未来加字体/图片）
"task_planner.main" = ["assets/*"]
#  配置工具若有静态资源（当前没有，占位）
"task_planner.config_ui" = ["*.txt", "*.yaml"]


# ══════════════════════════════════════════════════
#  工具链配置
# ══════════════════════════════════════════════════

[tool.black]
line-length = 100
#  black 24.x 支持到 py313；black 25.x 起支持 py314。
#    如 `black --check` 报 "Invalid value for '--target-version'"，降为 py313。
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["scripts/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF"]
ignore = [
    # ── 已有 ──
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF022",

    # ── 新增 ──
    "RUF012",  # 类默认可变值——GoodAddons/_SingletonMeta 依赖此模式
    "RUF005",  # 列表拼接——`+` 比 `[*...]` 可读
    "UP047",   # PEP 695 泛型语法需 3.12+，good_addons 保持 3.10 兼容
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "E402"]   # E402：包的出口 import 顺序特殊
"src/task_planner/abandon/*" = ["ALL"]
"tests/**/*" = ["F401", "F811", "E501", "B008", "F841", "B905", "UP036"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
extraPaths = ["src", "tests"]
# 归档代码不检查（旧版本语法/缺依赖）
exclude = [
    "src/task_planner/abandon",
    "**/node_modules",
    "**/__pycache__",
    ".compat_removal_backup",
]
#  关掉"第三方库缺 stub"警告
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
pythonpath = [".", "src"]
testpaths = ["tests"]
norecursedirs = [
    "tests/abandon",
    ".git",
    ".venv",
    "venv",
    "node_modules",
    "build",
    "dist",
    "*.egg-info",
    "__pycache__",
]
filterwarnings = [
    "error::DeprecationWarning:task_planner.*",
    "error::ResourceWarning:task_planner.*",
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pymongo.*",
    "ignore::DeprecationWarning:motor.*",
    "ignore::DeprecationWarning:dash.*",
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:langsmith.*",
    "ignore::ResourceWarning:httpx.*",
]
# 排除逻辑在 CI test job 命令行里做
addopts = ""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests requiring external services (Redis, MongoDB, etc.)",
    "eval: marks evaluation suite tests (REAL LLM by default, use USE_MOCK_LLM=true to skip)",
    "unit: marks pure unit tests (no I/O, no Agent, no DB)",
    "eval_live: 真实 LLM 评估（默认跳过，需 --eval-live）",
]

[tool.coverage.run]
source = ["task_planner"]
omit = ["*/tests/*", "*/abandon/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
